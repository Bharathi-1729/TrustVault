<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrustVault — Secure Enterprise Document Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg-main: #f8fafc;
  --bg-card: #ffffff;
  --bg-sidebar: #0f172a;
  --bg-header: #ffffff;
  --tx-primary: #0f172a;
  --tx-secondary: #475569;
  --tx-muted: #94a3b8;
  --tx-sidebar: #e2e8f0;
  --pri-600: #2563eb;
  --pri-700: #1d4ed8;
  --pri-50: #eff6ff;
  --acc-teal: #0d9488;
  --border: #e2e8f0;
  --border-sidebar: #1e293b;
  --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
  --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.07), 0 2px 4px -2px rgb(0 0 0 / 0.07);
  --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.08), 0 4px 6px -4px rgb(0 0 0 / 0.08);
  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 16px;
  --badge-ok-bg: #dcfce7; --badge-ok-tx: #15803d;
  --badge-warn-bg: #fef3c7; --badge-warn-tx: #b45309;
  --badge-bad-bg: #fee2e2; --badge-bad-tx: #b91c1c;
  --badge-info-bg: #e0f2fe; --badge-info-tx: #0369a1;
}

[data-theme="dark"] {
  --bg-main: #0b0f17;
  --bg-card: #151c28;
  --bg-sidebar: #090d16;
  --bg-header: #151c28;
  --tx-primary: #f1f5f9;
  --tx-secondary: #94a3b8;
  --tx-muted: #64748b;
  --tx-sidebar: #cbd5e1;
  --border: #232d3f;
  --border-sidebar: #192233;
  --pri-50: rgba(37, 99, 235, 0.15);
  --badge-ok-bg: rgba(22, 101, 52, 0.25); --badge-ok-tx: #4ade80;
  --badge-warn-bg: rgba(180, 83, 9, 0.25); --badge-warn-tx: #fcd34d;
  --badge-bad-bg: rgba(185, 28, 28, 0.25); --badge-bad-tx: #fca5a5;
  --badge-info-bg: rgba(3, 105, 161, 0.25); --badge-info-tx: #38bdf8;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; background: var(--bg-main); color: var(--tx-primary); min-height: 100vh; line-height: 1.5; font-size: 14px; }

/* SVG Icon Base */
.icon { display: inline-block; width: 18px; height: 18px; stroke-width: 2; stroke: currentColor; fill: none; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; }
.icon-lg { width: 24px; height: 24px; }
.icon-xl { width: 36px; height: 36px; }

/* Auth Layout */
.auth-wrapper { display: flex; min-height: 100vh; width: 100%; }
.auth-left { flex: 1.2; background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f766e 100%); color: #ffffff; padding: 60px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
.auth-left::before { content: ''; position: absolute; top: -100px; right: -100px; width: 400px; height: 400px; background: rgba(37, 99, 235, 0.2); filter: blur(80px); border-radius: 50%; }
.auth-right { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; background: var(--bg-main); }
.auth-card { width: 100%; max-width: 440px; background: var(--bg-card); border-radius: var(--radius-lg); padding: 36px; border: 1px solid var(--border); box-shadow: var(--shadow-lg); }

.brand-header { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 22px; letter-spacing: -0.5px; }
.brand-icon { width: 40px; height: 40px; background: linear-gradient(135deg, #2563eb, #0d9488); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }

.auth-highlights { display: flex; flex-direction: column; gap: 20px; margin-top: 40px; }
.auth-highlight-item { display: flex; align-items: flex-start; gap: 16px; background: rgba(255, 255, 255, 0.06); backdrop-filter: blur(10px); padding: 18px; border-radius: var(--radius); border: 1px solid rgba(255, 255, 255, 0.1); }
.auth-highlight-icon { width: 36px; height: 36px; background: rgba(37, 99, 235, 0.3); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #38bdf8; flex-shrink: 0; }

/* Dashboard Layout */
.app-container { display: flex; min-height: 100vh; }
.sidebar { width: 260px; background: var(--bg-sidebar); color: var(--tx-sidebar); display: flex; flex-direction: column; transition: all 0.3s ease; flex-shrink: 0; z-index: 50; }
.sidebar-header { padding: 20px 24px; border-bottom: 1px solid var(--border-sidebar); display: flex; align-items: center; justify-content: space-between; }
.sidebar-nav { padding: 20px 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; overflow-y: auto; }
.nav-group-title { font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--tx-muted); padding: 12px 12px 6px; letter-spacing: 0.8px; }
.nav-item { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: var(--radius-sm); color: var(--tx-sidebar); text-decoration: none; font-weight: 500; font-size: 13.5px; cursor: pointer; transition: all 0.15s ease; }
.nav-item:hover { background: rgba(255, 255, 255, 0.08); color: #ffffff; }
.nav-item.active { background: var(--pri-600); color: #ffffff; font-weight: 600; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }

.main-content { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow-x: hidden; }
.top-header { height: 68px; background: var(--bg-header); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 28px; sticky: top; top: 0; z-index: 40; }
.page-body { padding: 28px; flex: 1; }

/* UI Components */
.card { background: var(--bg-card); border-radius: var(--radius); border: 1px solid var(--border); padding: 24px; box-shadow: var(--shadow-sm); margin-bottom: 24px; }
.card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.card-title { font-size: 17px; font-weight: 700; color: var(--tx-primary); display: flex; align-items: center; gap: 10px; }

/* Stats Grid */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 28px; }
.stat-card { background: var(--bg-card); border-radius: var(--radius); border: 1px solid var(--border); padding: 20px; box-shadow: var(--shadow-sm); transition: transform 0.2s ease, box-shadow 0.2s ease; }
.stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.stat-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.stat-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
.stat-val { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; color: var(--tx-primary); }
.stat-lbl { font-size: 13px; font-weight: 500; color: var(--tx-secondary); }

/* Form Controls */
.form-group { margin-bottom: 18px; }
.form-label { display: block; font-size: 13px; font-weight: 600; color: var(--tx-primary); margin-bottom: 6px; }
.form-control, .form-select { width: 100%; padding: 10px 14px; font-size: 14px; font-family: inherit; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-card); color: var(--tx-primary); transition: border-color 0.15s ease, box-shadow 0.15s ease; }
.form-control:focus, .form-select:focus { outline: none; border-color: var(--pri-600); box-shadow: 0 0 0 3px var(--pri-50); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 18px; font-size: 13.5px; font-weight: 600; border-radius: var(--radius-sm); border: 1px solid transparent; cursor: pointer; transition: all 0.15s ease; font-family: inherit; text-decoration: none; }
.btn-primary { background: var(--pri-600); color: #ffffff; }
.btn-primary:hover { background: var(--pri-700); box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25); }
.btn-secondary { background: var(--bg-main); color: var(--tx-primary); border-color: var(--border); }
.btn-secondary:hover { background: var(--border); }
.btn-danger { background: #ef4444; color: #ffffff; }
.btn-danger:hover { background: #dc2626; }
.btn-sm { padding: 6px 12px; font-size: 12.5px; }

/* Tables */
.table-responsive { width: 100%; overflow-x: auto; border-radius: var(--radius); border: 1px solid var(--border); }
table { width: 100%; border-collapse: collapse; text-align: left; }
th { background: var(--bg-main); padding: 12px 18px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--tx-secondary); border-bottom: 1px solid var(--border); }
td { padding: 14px 18px; border-bottom: 1px solid var(--border); font-size: 13.5px; color: var(--tx-primary); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(37, 99, 235, 0.02); }

/* Badges */
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
.badge-success { background: var(--badge-ok-bg); color: var(--badge-ok-tx); }
.badge-warning { background: var(--badge-warn-bg); color: var(--badge-warn-tx); }
.badge-danger { background: var(--badge-bad-bg); color: var(--badge-bad-tx); }
.badge-info { background: var(--badge-info-bg); color: var(--badge-info-tx); }

/* Upload Drag & Drop */
.upload-zone { border: 2px dashed var(--pri-600); border-radius: var(--radius-lg); padding: 48px 24px; text-align: center; background: var(--pri-50); cursor: pointer; transition: all 0.2s ease; margin-bottom: 24px; }
.upload-zone:hover, .upload-zone.dragover { background: rgba(37, 99, 235, 0.12); border-color: var(--pri-700); transform: scale(1.005); }

/* Grid / List View Toggle */
.document-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
.doc-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; justify-content: space-between; transition: all 0.2s ease; position: relative; }
.doc-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: var(--pri-600); }

/* Modal Dialog */
.modal-backdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
.modal-backdrop.show { opacity: 1; pointer-events: auto; }
.modal-content { background: var(--bg-card); border-radius: var(--radius-lg); border: 1px solid var(--border); width: 92%; max-width: 640px; max-height: 90vh; overflow-y: auto; padding: 28px; box-shadow: var(--shadow-lg); transform: translateY(20px); transition: transform 0.2s ease; }
.modal-backdrop.show .modal-content { transform: translateY(0); }

/* Toast Notification */
#toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 200; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
.toast { padding: 14px 20px; border-radius: var(--radius); background: var(--bg-card); color: var(--tx-primary); border: 1px solid var(--border); box-shadow: var(--shadow-lg); display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 13.5px; pointer-events: auto; animation: toastIn 0.3s ease; }
.toast-success { border-left: 4px solid #16a34a; }
.toast-error { border-left: 4px solid #dc2626; }
@keyframes toastIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

/* SVG Chart */
.chart-bar-container { display: flex; align-items: flex-end; gap: 12px; height: 160px; padding-top: 20px; }
.chart-bar { flex: 1; background: linear-gradient(180deg, var(--pri-600), var(--acc-teal)); border-radius: 6px 6px 0 0; position: relative; transition: height 0.5s ease; min-height: 4px; }
.chart-bar-label { position: absolute; bottom: -24px; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--tx-muted); font-weight: 600; white-space: nowrap; }

/* Responsive adjustments */
@media (max-width: 900px) {
  .auth-left { display: none; }
  .sidebar { position: fixed; left: -260px; top: 0; bottom: 0; }
  .sidebar.open { left: 0; }
}
</style>
</head>
<body>

<div id="toast-container"></div>
<div id="modal-container" class="modal-backdrop">
  <div class="modal-content" id="modal-body"></div>
</div>

<div id="app"></div>

<script>
// --- SVG Icons Library ---
const Icons = {
  shield: `<svg class="icon" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>`,
  file: `<svg class="icon" viewBox="0 0 24 24"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>`,
  users: `<svg class="icon" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`,
  upload: `<svg class="icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>`,
  download: `<svg class="icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`,
  share: `<svg class="icon" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>`,
  activity: `<svg class="icon" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>`,
  lock: `<svg class="icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`,
  search: `<svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>`,
  settings: `<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>`,
  logout: `<svg class="icon" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>`,
  eye: `<svg class="icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`,
  trash: `<svg class="icon" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>`,
  edit: `<svg class="icon" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`,
  check: `<svg class="icon" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>`,
  alert: `<svg class="icon" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
  grid: `<svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>`,
  list: `<svg class="icon" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>`,
  moon: `<svg class="icon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`,
  sun: `<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`
};

// --- State ---
let state = {
  me: null,
  activeTab: 'overview',
  viewMode: 'grid', // 'grid' or 'table'
  page: 1,
  pageSize: 12,
  search: { name: '', category: '', ownerId: '', fileType: '', sort: 'newest' },
  theme: localStorage.getItem('tv_theme') || 'light'
};

document.documentElement.setAttribute('data-theme', state.theme);

// --- Helpers ---
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = s => s ? new Date(s.endsWith('Z') ? s : s + 'Z').toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' }) : '-';
const fmtSize = b => b > 1048576 ? (b / 1048576).toFixed(2) + ' MB' : (b / 1024).toFixed(1) + ' KB';

function toast(msg, isError = false) {
  const container = $('#toast-container');
  const div = document.createElement('div');
  div.className = `toast ${isError ? 'toast-error' : 'toast-success'}`;
  div.innerHTML = `${isError ? Icons.alert : Icons.check} <span>${esc(msg)}</span>`;
  container.appendChild(div);
  setTimeout(() => { div.style.opacity = '0'; setTimeout(() => div.remove(), 300); }, 3500);
}

function openModal(html) {
  $('#modal-body').innerHTML = html;
  $('#modal-container').classList.add('show');
}
function closeModal() {
  $('#modal-container').classList.remove('show');
}
$('#modal-container').onclick = e => { if (e.target.id === 'modal-container') closeModal(); };

async function api(path, opts = {}) {
  try {
    const res = await fetch('/api' + path, opts);
    let body = null;
    const ct = res.headers.get('content-type') || '';
    if (ct.includes('json')) body = await res.json().catch(() => null);
    return { ok: res.ok, status: res.status, body };
  } catch (err) {
    return { ok: false, status: 500, body: { error: 'Network connection failed' } };
  }
}

// --- Navigation Tabs Mapping per Role ---
function getNavTabs() {
  if (!state.me) return [];
  const role = state.me.role;
  if (role === 'Admin') {
    return [
      { id: 'overview', label: 'Overview', icon: Icons.activity },
      { id: 'users', label: 'User Management', icon: Icons.users },
      { id: 'documents', label: 'All Documents', icon: Icons.file },
      { id: 'audit', label: 'Audit Trail', icon: Icons.shield },
      { id: 'security', label: 'Security Monitoring', icon: Icons.lock },
      { id: 'settings', label: 'Settings', icon: Icons.settings }
    ];
  } else if (role === 'Owner') {
    return [
      { id: 'overview', label: 'Overview', icon: Icons.activity },
      { id: 'documents', label: 'My Documents', icon: Icons.file },
      { id: 'upload', label: 'Upload Document', icon: Icons.upload },
      { id: 'permissions', label: 'Manage Access', icon: Icons.share },
      { id: 'search', label: 'Global Search', icon: Icons.search },
      { id: 'settings', label: 'Settings', icon: Icons.settings }
    ];
  } else { // Viewer
    return [
      { id: 'overview', label: 'Overview', icon: Icons.activity },
      { id: 'shared', label: 'Shared With Me', icon: Icons.file },
      { id: 'search', label: 'Global Search', icon: Icons.search },
      { id: 'settings', label: 'Settings', icon: Icons.settings }
    ];
  }
}

function attachAuthEvents(mode) {
  if (mode === 'login') {
    $('#link-register').onclick = e => { e.preventDefault(); renderAuthScreen('register'); };
    document.querySelectorAll('.demo-fill').forEach(btn => {
      btn.onclick = () => {
        $('#login-email').value = btn.dataset.e;
        $('#login-pass').value = btn.dataset.p;
      };
    });
    $('#form-login').onsubmit = async e => {
      e.preventDefault();
      const res = await api('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: $('#login-email').value, password: $('#login-pass').value })
      });
      if (res.ok) {
        toast('Sign in successful!');
        boot();
      } else {
        toast(res.status === 429 ? 'Rate limit exceeded. Please wait a minute.' : 'Invalid email or password', true);
      }
    };
  } else {
    $('#link-login').onclick = e => { e.preventDefault(); renderAuthScreen('login'); };
    $('#form-register').onsubmit = async e => {
      e.preventDefault();
      const res = await api('/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          displayName: $('#reg-name').value,
          email: $('#reg-email').value,
          password: $('#reg-pass').value,
          role: $('#reg-role').value
        })
      });
      if (res.ok) {
        toast('Account created! Please sign in with your credentials.');
        renderAuthScreen('login');
      } else {
        toast(res.body?.error || 'Registration failed', true);
      }
    };
  }
}

// --- Main Application Shell ---
function renderAppShell() {
  const tabs = getNavTabs();
  if (!tabs.find(t => t.id === state.activeTab)) state.activeTab = tabs[0].id;

  $('#app').innerHTML = `
    <div class="app-container">
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="brand-header">
            <div class="brand-icon">${Icons.shield}</div>
            <span style="color: #ffffff;">TrustVault</span>
          </div>
        </div>
        <div class="sidebar-nav">
          <div class="nav-group-title">Navigation</div>
          ${tabs.map(t => `
            <a class="nav-item ${t.id === state.activeTab ? 'active' : ''}" data-tab="${t.id}">
              ${t.icon} <span>${t.label}</span>
            </a>
          `).join('')}
        </div>
        <div style="padding: 16px 20px; border-top: 1px solid var(--border-sidebar); font-size: 12px; color: var(--tx-muted);">
          Logged in as <span style="color: #ffffff; font-weight: 600;">${esc(state.me.displayName)}</span>
        </div>
      </aside>
      <main class="main-content">
        <header class="top-header">
          <div style="display: flex; align-items: center; gap: 16px;">
            <h2 style="font-size: 18px; font-weight: 700;">${tabs.find(t => t.id === state.activeTab)?.label || 'Dashboard'}</h2>
          </div>
          <div style="display: flex; align-items: center; gap: 16px;">
            <button class="btn btn-secondary btn-sm" id="btn-theme-toggle">
              ${state.theme === 'dark' ? Icons.sun : Icons.moon}
            </button>
            <div style="display: flex; align-items: center; gap: 10px; padding-left: 12px; border-left: 1px solid var(--border);">
              <div style="text-align: right;">
                <div style="font-weight: 700; font-size: 13.5px;">${esc(state.me.displayName)}</div>
                <div style="font-size: 11px; color: var(--tx-secondary); text-transform: uppercase; font-weight: 600;">${esc(state.me.role)}</div>
              </div>
              <button class="btn btn-secondary btn-sm" id="btn-logout" title="Sign Out">
                ${Icons.logout}
              </button>
            </div>
          </div>
        </header>
        <div class="page-body" id="page-content"></div>
      </main>
    </div>
  `;

  document.querySelectorAll('[data-tab]').forEach(el => {
    el.onclick = () => {
      state.activeTab = el.dataset.tab;
      state.page = 1;
      renderAppShell();
    };
  });

  $('#btn-theme-toggle').onclick = () => {
    state.theme = state.theme === 'dark' ? 'light' : 'dark';
    localStorage.setItem('tv_theme', state.theme);
    document.documentElement.setAttribute('data-theme', state.theme);
    renderAppShell();
  };

  $('#btn-logout').onclick = async () => {
    await api('/auth/logout', { method: 'POST' });
    state.me = null;
    toast('Logged out successfully');
    renderAuthScreen('login');
  };

  renderActiveTab();
}

// --- Render Page Content by Active Tab ---
function renderActiveTab() {
  const container = $('#page-content');
  if (state.activeTab === 'overview') renderOverviewView(container);
  else if (state.activeTab === 'users') renderUserManagementView(container);
  else if (state.activeTab === 'documents') renderDocumentsView(container);
  else if (state.activeTab === 'upload') renderUploadView(container);
  else if (state.activeTab === 'permissions') renderPermissionsView(container);
  else if (state.activeTab === 'shared') renderSharedView(container);
  else if (state.activeTab === 'audit') renderAuditView(container);
  else if (state.activeTab === 'security') renderSecurityView(container);
  else if (state.activeTab === 'search') renderSearchView(container);
  else if (state.activeTab === 'settings') renderSettingsView(container);
}

      <div class="document-grid">
        ${items.map(d => renderDocumentCard(d)).join('') || `<div class="card" style="grid-column: 1/-1; text-align: center; color: var(--tx-muted);">No documents found</div>`}
      </div>
    ` : `
      <div class="card">
        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>Document Name</th>
                <th>Category</th>
                <th>Size</th>
                <th>Access Status</th>
                <th>Last Modified</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              ${items.map(d => `
                <tr>
                  <td style="font-weight: 600;">${esc(d.name)}</td>
                  <td><span class="badge badge-info">${esc(d.category || 'General')}</span></td>
                  <td>${fmtSize(d.sizeBytes)}</td>
                  <td>${d.ownerId === state.me.id ? '<span class="badge badge-success">Owner</span>' : '<span class="badge badge-warning">Shared</span>'}</td>
                  <td>${fmtDate(d.updatedAtUtc)}</td>
                  <td>${renderDocumentActions(d)}</td>
                </tr>
              `).join('') || `<tr><td colspan="6" style="text-align:center;color:var(--tx-muted);">No documents found</td></tr>`}
            </tbody>
          </table>
        </div>
      </div>
    `}
  `;

  $('#btn-doc-search').onclick = () => {
    state.search.name = $('#doc-search-name').value;
    state.search.category = $('#doc-search-cat').value;
    state.page = 1;
    renderDocumentsView(container);
  };
  $('#btn-view-grid').onclick = () => { state.viewMode = 'grid'; renderDocumentsView(container); };
  $('#btn-view-table').onclick = () => { state.viewMode = 'table'; renderDocumentsView(container); };

  attachDocumentEvents(container);
}

function renderDocumentCard(d) {
  const isMine = d.ownerId === state.me.id;
  return `
    <div class="doc-card">
      <div>
        <div style="display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px;">
          <div style="width: 40px; height: 40px; background: var(--pri-50); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--pri-600);">
            ${Icons.file}
          </div>
          <span class="badge ${isMine ? 'badge-success' : 'badge-warning'}">${isMine ? 'Owner' : 'Shared'}</span>
        </div>
        <h4 style="font-size: 15px; font-weight: 700; margin-bottom: 6px; word-break: break-word;">${esc(d.name)}</h4>
        <div style="font-size: 12px; color: var(--tx-secondary); margin-bottom: 12px;">
          <div>Category: <strong>${esc(d.category || 'General')}</strong></div>
          <div>Size: <strong>${fmtSize(d.sizeBytes)}</strong></div>
        </div>
      </div>
      <div style="border-top: 1px solid var(--border); padding-top: 12px; margin-top: 12px; display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 11px; color: var(--tx-muted);">${fmtDate(d.updatedAtUtc)}</span>
        <div>${renderDocumentActions(d)}</div>
      </div>
    </div>
  `;
}

function renderDocumentActions(d) {
  const isMine = d.ownerId === state.me.id;
  return `
    <button class="btn btn-secondary btn-sm doc-act-preview" data-id="${d.id}" title="Preview Details">${Icons.eye}</button>
    <button class="btn btn-secondary btn-sm doc-act-download" data-id="${d.id}" data-name="${esc(d.name)}" title="Download">${Icons.download}</button>
    ${isMine ? `
      <button class="btn btn-secondary btn-sm doc-act-share" data-id="${d.id}" title="Manage Share Access">${Icons.share}</button>
      <button class="btn btn-danger btn-sm doc-act-delete" data-id="${d.id}" title="Delete Document">${Icons.trash}</button>
    ` : ''}
  `;
}

function attachDocumentEvents(container) {
  document.querySelectorAll('.doc-act-preview').forEach(btn => {
    btn.onclick = () => showDocumentDetailsModal(btn.dataset.id);
  });
  document.querySelectorAll('.doc-act-download').forEach(btn => {
    btn.onclick = async () => {
      const res = await fetch(`/api/documents/${btn.dataset.id}/download`);
      if (!res.ok) return toast(`Download failed (${res.status})`, true);
      const blob = await res.blob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = btn.dataset.name;
      a.click();
      URL.revokeObjectURL(a.href);
      toast('Document download started');
    };
  });
  document.querySelectorAll('.doc-act-share').forEach(btn => {
    btn.onclick = () => showShareModal(btn.dataset.id);
  });
  document.querySelectorAll('.doc-act-delete').forEach(btn => {
    btn.onclick = async () => {
      if (!confirm('Are you sure you want to delete this document? Access will be immediately revoked for all users.')) return;
      const res = await api(`/documents/${btn.dataset.id}`, { method: 'DELETE' });
      if (res.ok) {
        toast('Document deleted');
        renderDocumentsView(container);
      } else {
        toast('Failed to delete document', true);
      }
    };
  });
}

// --- 4. Document Details Modal ---

      <button class="btn btn-secondary btn-sm" onclick="closeModal()">✕</button>
    </div>

        <div style="font-size: 16px; font-weight: 700;">${esc(d.name)}</div>
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        <div>
          <div style="font-size: 12px; color: var(--tx-muted); font-weight: 600;">CATEGORY</div>

        </div>
        <div>

        </div>

          <div>${esc(d.ownerName)} (${esc(d.ownerEmail)})</div>
        </div>
        <div>
          <div style="font-size: 12px; color: var(--tx-muted); font-weight: 600;">MIME TYPE</div>

        <div style="font-family: monospace; font-size: 11px; background: var(--bg-main); padding: 8px; border-radius: 4px; word-break: break-all;">${esc(d.sha256)}</div>
      </div>

          <div style="font-size: 12px; color: var(--tx-muted); font-weight: 600;">ACTIVE GRANTS</div>
          <div><span class="badge badge-info">${d.activeGrantsCount} Users</span></div>

  `);
}

// --- 5. Share & Permission Management Modal ---
async function showShareModal(docId) {
  const drawModal = async () => {
    const res = await api(`/documents/${docId}/permissions`);
    const grants = res.body || [];

    openModal(`
      <div class="card-header">
        <span class="card-title">${Icons.share} Manage Document Access</span>
        <button class="btn btn-secondary btn-sm" onclick="closeModal()">✕</button>
      </div>

      <div style="margin-bottom: 24px; background: var(--bg-main); padding: 16px; border-radius: var(--radius); border: 1px solid var(--border);">
        <h4 style="font-size: 14px; font-weight: 700; margin-bottom: 12px;">Grant Access to User</h4>
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
          <input type="email" id="share-target-email" class="form-control" style="flex: 2; min-width: 200px;" placeholder="Registered user email...">
          <select id="share-level" class="form-select" style="flex: 1; min-width: 110px;">
            <option value="Read">READ</option>
            <option value="Edit">EDIT</option>
          </select>
          <button class="btn btn-primary" id="btn-grant-access">${Icons.check} Grant</button>
        </div>
      </div>

      <h4 style="font-size: 14px; font-weight: 700; margin-bottom: 12px;">Active Access Grants</h4>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>User Email</th>
              <th>Permission Level</th>
              <th>Granted Date</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            ${grants.map(g => `
              <tr>
                <td style="font-weight: 600;">${esc(g.email)}</td>
                <td><span class="badge ${g.level === 'Edit' ? 'badge-warning' : 'badge-info'}">${g.level}</span></td>
                <td>${fmtDate(g.grantedAtUtc)}</td>
                <td>
                  <button class="btn btn-danger btn-sm btn-revoke-grant" data-user="${g.userId}">Revoke</button>
                </td>
              </tr>
            `).join('') || `<tr><td colspan="4" style="text-align:center;color:var(--tx-muted);">Not shared with any users</td></tr>`}
          </tbody>
        </table>
      </div>
      <div style="margin-top: 24px; text-align: right;">
        <button class="btn btn-secondary" onclick="closeModal()">Close</button>
      </div>
    `);

    $('#btn-grant-access').onclick = async () => {
      const email = $('#share-target-email').value.trim();
      const level = $('#share-level').value;
      if (!email) return toast('Please enter a user email', true);

      // Lookup target user
      const lookup = await api(`/users/lookup?email=${encodeURIComponent(email)}`);
      if (!lookup.ok) return toast('User not found or ineligible for sharing', true);

      const targetId = lookup.body.id;
      const grantRes = await api(`/documents/${docId}/permissions/${targetId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ level })
      });

      if (grantRes.ok) {
        toast(`Access granted to ${email}`);
        drawModal();
      } else {
        toast(grantRes.body?.error || 'Failed to grant access', true);
      }
    };

    document.querySelectorAll('.btn-revoke-grant').forEach(btn => {
      btn.onclick = async () => {
        const userId = btn.dataset.user;
        const revRes = await api(`/documents/${docId}/permissions/${userId}`, { method: 'DELETE' });
        if (revRes.ok) {
          toast('Access revoked immediately');
          drawModal();
        } else {
          toast('Failed to revoke access', true);
        }
      };
    });
  };

  drawModal();
}

// --- 6. Upload View (Owner) ---
function renderUploadView(container) {
  container.innerHTML = `
    <div class="card" style="max-width: 680px; margin: 0 auto;">
      <div class="card-header">
        <span class="card-title">${Icons.upload} Upload Confidential Document</span>
      </div>
      <form id="form-upload">
        <div class="upload-zone" id="drop-zone">
          <div style="color: var(--pri-600); margin-bottom: 12px;">${Icons.upload}</div>
          <h3 style="font-size: 16px; font-weight: 700;">Drag & Drop files here</h3>
          <p style="color: var(--tx-secondary); font-size: 13px; margin: 6px 0 16px;">Or click browse to select a file from your computer</p>
          <input type="file" id="upload-file-input" style="display: none;" accept=".pdf,.png,.jpg,.jpeg,.docx,.xlsx">
          <button type="button" class="btn btn-secondary" onclick="$('#upload-file-input').click()">Browse Files</button>
          <div id="file-name-preview" style="margin-top: 14px; font-weight: 700; color: var(--pri-600);"></div>
        </div>

        <div class="form-group">
          <label class="form-label">Category</label>
          <input type="text" id="upload-cat" class="form-control" placeholder="e.g. Legal, Finance, Engineering, HR">
        </div>
        <div class="form-group">
          <label class="form-label">Description (Optional)</label>
          <textarea id="upload-desc" class="form-control" rows="3" placeholder="Brief notes on document contents..."></textarea>
        </div>

        <div style="font-size: 12px; color: var(--tx-muted); margin-bottom: 20px;">
          Allowed file types: <strong>PDF, PNG, JPG, DOCX, XLSX</strong> (Max size: 10 MB). File content magic headers are verified server-side.
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">${Icons.upload} Upload Document</button>
      </form>
    </div>
  `;

  const dropZone = $('#drop-zone');
  const fileInput = $('#upload-file-input');
  const preview = $('#file-name-preview');

  fileInput.onchange = () => {
    if (fileInput.files[0]) preview.textContent = `Selected: ${fileInput.files[0].name} (${fmtSize(fileInput.files[0].size)})`;
  };

  dropZone.ondragover = e => { e.preventDefault(); dropZone.classList.add('dragover'); };
  dropZone.ondragleave = () => dropZone.classList.remove('dragover');
  dropZone.ondrop = e => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files[0]) {
      fileInput.files = e.dataTransfer.files;
      preview.textContent = `Selected: ${fileInput.files[0].name} (${fmtSize(fileInput.files[0].size)})`;
    }
  };

  $('#form-upload').onsubmit = async e => {
    e.preventDefault();
    const file = fileInput.files[0];
    if (!file) return toast('Please select a file to upload', true);

    const fd = new FormData();
    fd.append('file', file);
    fd.append('category', $('#upload-cat').value);
    fd.append('description', $('#upload-desc').value);

    toast('Uploading document...');
    const res = await api('/documents', { method: 'POST', body: fd });
    if (res.ok) {
      toast('Document uploaded successfully');
      state.activeTab = 'documents';
      renderAppShell();
    } else {
      toast(res.body?.error || 'Upload failed', true);
    }
  };
}

    <div class="card">
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Event #</th>
              <th>Time</th>
              <th>Actor User</th>
              <th>Action</th>
              <th>Target Document</th>
              <th>Outcome</th>

          <tbody>
