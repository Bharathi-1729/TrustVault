<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrustVault Dashboard</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="dashboard-page">
  <div id="app-shell">
    <header class="topbar">
      <div>
        <h1>TrustVault</h1>
      </div>
      <div class="topbar-actions">
        <span id="userBadge" class="user-badge"></span>
        <button id="logoutBtn" class="secondary-btn" type="button">Logout</button>
      </div>
    </header>

    <main class="dashboard-grid">
      <section class="panel">
        <h2>Overview</h2>
        <div class="stats-grid">
          <div class="stat-card">
            <span>Documents</span>
            <strong id="documentCount">0</strong>
          </div>
          <div class="stat-card">
            <span>Users</span>
            <strong id="userCount">0</strong>
          </div>
          <div class="stat-card">
            <span>Admins</span>
            <strong id="adminCount">0</strong>
          </div>
          <div class="stat-card">
            <span>Audit events</span>
            <strong id="auditCount">0</strong>
          </div>
        </div>
      </section>

      <section id="uploadPanel" class="panel">
        <h2>Upload document</h2>
        <form id="uploadForm" enctype="multipart/form-data">
          <label>
            File
            <input type="file" id="documentFile" name="file" required />
          </label>
          <label>
            Category
            <input type="text" id="categoryInput" name="category" placeholder="contracts, payroll, legal" />
          </label>
          <label>
            Description
            <textarea id="descriptionInput" name="description" rows="3" placeholder="Optional notes"></textarea>
          </label>
          <button type="submit" class="primary-btn">Upload</button>
        </form>
        <div id="uploadMessage" class="status-message" aria-live="polite"></div>
      </section>

      <section class="panel">
        <h2>Search documents</h2>
        <form id="searchForm" class="inline-form">
          <input type="search" id="searchInput" placeholder="Search by name, owner, category, date" />
          <button type="submit" class="secondary-btn">Search</button>
        </form>
      </section>

      <section class="panel wide-panel">
        <div class="panel-header-row">
          <h2>Documents</h2>
          <div class="page-controls">
            <button id="prevPageBtn" class="secondary-btn" type="button">Previous</button>
            <span id="pageLabel">Page 1</span>
            <button id="nextPageBtn" class="secondary-btn" type="button">Next</button>
          </div>
        </div>
        <div id="documentList" class="document-list"></div>
      </section>

      <section id="sharePanel" class="panel">
        <h2>Share access</h2>
        <form id="shareForm">
          <label>
            Document
            <select id="shareDocumentSelect" required></select>
          </label>
          <label>
            User
            <select id="shareUserSelect" required></select>
          </label>
          <label>
            Permission
            <select id="sharePermissionSelect">
              <option value="read">Read</option>
              <option value="edit">Edit</option>
            </select>
          </label>
          <label>
            Expiration (optional)
            <input type="datetime-local" id="shareExpirationInput" />
          </label>
          <button type="submit" class="primary-btn">Grant access</button>
        </form>
        <div id="shareMessage" class="status-message" aria-live="polite"></div>
        <h3>Current access</h3>
        <div id="sharedAccessList" class="shared-access-list"></div>
      </section>

      <section id="adminSection" class="panel hidden">
        <h2>Administrative controls</h2>
        <h3>Registered users</h3>
        <div id="adminUsersList" class="admin-list"></div>
        <h3>Recent audit activity</h3>
        <div id="auditList" class="audit-list"></div>
      </section>
    </main>
  </div>

  <script src="./app.js"></script>
</body>
</html>
